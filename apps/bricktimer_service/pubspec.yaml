name: bricktimer_service
description: Brick Timer Firebase Cloud Functions service.
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.11.4

dependencies:
  firebase_admin_sdk: ^0.5.3
  firebase_functions: ^0.6.0
  lego_catalog:
    path: ../../packages/lego_catalog

dev_dependencies:
  build_runner: ^2.15.0
  test: ^1.26.0
  very_good_analysis: ^10.2.0

# This package intentionally stays tiny: the HTTP handlers live here, while
# catalog fetching and Rebrickable mapping are reused from lego_catalog.
