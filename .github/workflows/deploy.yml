name: CI and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: make deps

      - name: Check generated app assets
        run: make check-assets

      - name: Check formatting
        run: make format && git diff --exit-code

      - name: Static analysis
        run: make lint

      - name: Run unit tests
        run: make test-unit-ci

  integration:
    runs-on: macos-latest
    needs: checks

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: make deps

      - name: Run integration tests
        run: make test-integration-ci TEST_DEVICE=macos

  deploy:
    needs: integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: make deps

      - name: Build Web
        working-directory: apps/bricktimer
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          flutter build web --no-pub --release \
            --base-href "/lego-timer/" \
            --dart-define=COMMIT_HASH=$COMMIT_HASH \
            --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/bricktimer/build/web