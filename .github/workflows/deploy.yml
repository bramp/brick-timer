name: CI and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: make deps

      - name: Check generated app assets
        run: make check-assets

      - name: Check formatting
        run: make format && git diff --exit-code

      - name: Static analysis
        run: make lint

      - name: Run unit tests
        run: make test-unit-ci

  integration:
    runs-on: macos-latest
    needs: checks

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: make deps

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Run integration tests
        run: make test-integration-ci TEST_DEVICE=macos

  changes:
    runs-on: ubuntu-latest
    outputs:
      web_changed: ${{ steps.filter.outputs.web }}
      service_changed: ${{ steps.filter.outputs.service }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/bricktimer/**'
              - 'packages/lego_catalog/**'
            service:
              - 'apps/bricktimer_service/**'
              - 'packages/lego_catalog/**'

  deploy-web:
    needs: [integration, changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: make deps

      - name: Build Web
        working-directory: apps/bricktimer
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          BASE_HREF="/"

          flutter build web --no-pub --release \
            --base-href "$BASE_HREF" \
            --dart-define=COMMIT_HASH=$COMMIT_HASH \
            --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/bricktimer/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase:
    needs: [integration, changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.service_changed == 'true'
    environment:
      name: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Validate WIF deploy variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_WIF_PROVIDER" ] || [ -z "$GCP_DEPLOY_SA" ]; then
            echo "Missing one or more required variables: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: make deps

      - name: Ensure generated functions manifest is up to date
        working-directory: apps/bricktimer_service
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Enable Dart Functions experiment
        run: firebase experiments:enable dartfunctions

      - name: Deploy Cloud Functions
        working-directory: apps/bricktimer_service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: firebase deploy --only functions:bricktimer-service --project "$GCP_PROJECT_ID" --non-interactive
